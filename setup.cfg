# Configuração das ferramentas de verificação do OdontoProd.
# Rodar tudo de uma vez:  python verificar.py

[tool:pytest]
testpaths = tests
addopts = -q
filterwarnings =
    ignore::DeprecationWarning

[flake8]
max-line-length = 100
max-complexity = 20
exclude =
    .git,
    __pycache__,
    dados,
    docs,
    .streamlit
# E203/W503 conflitam com a formatação usual.
# E402 é padrão deliberado aqui: os scripts inserem a raiz em sys.path antes
# de importar src/ (o projeto não é instalado como pacote).
# C901 (complexidade) fica desligado enquanto os parsers não forem quebrados
# em funções menores — está registrado como dívida em docs/BACKLOG.md.
extend-ignore = E203, W503, E402, C901
per-file-ignores =
    tests/*: E402
